on: push
name: Clippy check
jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: dtolnay/rust-toolchain@master
        with:
            toolchain: nightly
            components: clippy
      - uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: this is a temporary way to exclude the "gpu" feature (which
          # requires a CUDA toolkit etc) from the clippy job until we merge the
          # 3di removal from main
          args: --features 3di
